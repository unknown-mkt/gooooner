<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Arsenal Match Report</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    :root {
      --arsenal-red: #EF0107;
      --arsenal-red-dark: #9C0104;
      --arsenal-gold: #D1B280;
      
      --pl-bg-dark: #190022;
      --pl-card-bg: #2b043a;
      --pl-card-border: #3f0d54;
      --pl-sub-text: #b59dbd;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #0b020f;
      color: #ffffff;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* 설정 패널 */
    .config-panel {
      width: 100%;
      max-width: 860px;
      background: var(--pl-card-bg);
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid var(--pl-card-border);
      box-sizing: border-box;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .config-panel input {
      flex: 1;
      padding: 12px 14px;
      background: #110018;
      border: 1px solid var(--pl-card-border);
      color: white;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    .config-panel input:focus {
      border-color: var(--arsenal-gold);
    }

    .btn-sync {
      background: var(--arsenal-red);
      color: white;
      border: 1px solid var(--arsenal-gold);
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      transition: background-color 0.2s ease;
    }

    .btn-sync:hover {
      background: var(--arsenal-red-dark);
    }

    .preview-container {
      display: flex;
      flex-direction: column;
      gap: 32px;
      align-items: center;
      width: 100%;
    }

    .card-wrapper {
      width: 860px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .btn-save-card {
      background: var(--pl-card-bg);
      color: var(--arsenal-gold);
      border: 1px solid var(--arsenal-gold);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-save-card:hover {
      background: var(--arsenal-gold);
      color: var(--pl-bg-dark);
    }

    .capture-card {
      width: 860px;
      background: var(--pl-bg-dark);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid var(--pl-card-border);
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      box-sizing: border-box;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .header-box {
      text-align: center;
      border-bottom: 2px solid var(--arsenal-red);
      padding-bottom: 20px;
      margin-bottom: 24px;
      position: relative;
    }

    .header-box::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 2px;
      background: var(--arsenal-gold);
    }

    .match-score-board {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
    }

    .team-name {
      color: #ffffff;
      font-size: 26px;
      font-weight: 800;
      width: 300px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .score-num {
      color: #ffffff;
      font-size: 52px;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 4px 12px rgba(239, 1, 7, 0.3);
    }

    .section-title {
      font-size: 16px;
      color: var(--arsenal-gold);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin: 28px 0;
      
      /* 포인트와 타이틀 전체를 오른쪽(안쪽)으로 밀어 넣기 */
      padding-left: 12px; 
      
      display: flex;
      align-items: center;
      gap: 8px;
    }



    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--arsenal-red);
      border-radius: 2px;
    }

    .pitch {
      background: #112817;
      border: 1px solid rgba(209, 178, 128, 0.3);
      border-radius: 14px;
      width: 100%;
      aspect-ratio: 105 / 68;
      position: relative;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .pitch-line-center {
      position: absolute; top: 0; bottom: 0; left: 50%;
      width: 1px; background: rgba(209, 178, 128, 0.25);
    }

    .pitch-circle {
      position: absolute; top: 50%; left: 50%;
      width: 110px; height: 110px;
      border: 1px solid rgba(209, 178, 128, 0.25);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .pitch-area-left {
      position: absolute; top: 20%; bottom: 20%; left: 0;
      width: 16%;
      border: 1px solid rgba(209, 178, 128, 0.25);
      border-left: none;
    }

    .pitch-area-right {
      position: absolute; top: 20%; bottom: 20%; right: 0;
      width: 16%;
      border: 1px solid rgba(209, 178, 128, 0.25);
      border-right: none;
    }

    .player-badge {
      position: absolute;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 2;
    }

    .jersey {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--arsenal-red) 0%, var(--arsenal-red-dark) 100%);
      border: 2px solid var(--arsenal-gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 15px;
      color: white;
      margin: 0 auto;
      box-shadow: 0 6px 14px rgba(0,0,0,0.7);
    }

    .player-name {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      background: rgba(25, 0, 34, 0.95);
      padding: 3px 8px;
      border-radius: 6px;
      margin-top: 5px;
      white-space: nowrap;
      border: 1px solid rgba(209, 178, 128, 0.4);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .v-timeline-container {
      position: relative;
      padding: 28px 0;
      display: flex;
      flex-direction: column;
      gap: 28px;
      min-height: 320px;
      width: 100%;
    }

    .v-timeline-line {
      position: absolute;
      left: 50%;
      width: 2px;
      background: var(--arsenal-gold);
      transform: translateX(-50%);
      top: 36px;
      bottom: 36px;
      opacity: 0.3;
      z-index: 1;
    }

    .v-timeline-item {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .v-timeline-node {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 4px;
      z-index: 3;
      font-size: 14px;
      font-weight: 700;
      color: var(--arsenal-gold);
      white-space: nowrap;
      background: var(--pl-bg-dark);
      padding: 4px 8px;
    }

    .v-timeline-node.boundary {
      z-index: 4;
      background: var(--pl-bg-dark);
      color: var(--pl-sub-text);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 1.5px;
      padding: 4px 10px;
      top: 2px;
    }

    .v-timeline-side {
      width: 50%;
      box-sizing: border-box;
      font-size: 14px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .v-timeline-side.left {
      padding-right: 60px;
      align-items: flex-end;
    }

    .v-timeline-side.right {
      padding-left: 60px;
      align-items: flex-start;
      margin-left: 0;
    }

    .event-card {
      display: inline-flex;
      flex-direction: column;
      gap: 6px;
      background: var(--pl-card-bg);
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid var(--pl-card-border);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      width: 350px;
      box-sizing: border-box;
      white-space: nowrap;
      text-align: left;
    }

    /* ★ GOAL 테두리 굵기 2px로 확장 ★ */
    .event-card.goal-card {
      border: 2px solid var(--arsenal-gold) !important;
      box-shadow: 0 4px 16px rgba(209, 178, 128, 0.35);
    }

    .event-card.og-card {
      border: 1px solid #ff4d4f !important;
      box-shadow: 0 4px 16px rgba(255, 77, 79, 0.35);
    }

    .event-card-header {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding-bottom: 10px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.12);
    }

    /* ★ 선수 이름이 없을 경우 하단 점선 제거용 클래스 ★ */
    .event-card-header.no-border {
      border-bottom: none !important;
      padding-bottom: 0 !important;
    }

    .event-card-header.goal { color: var(--arsenal-gold); }
    .event-card-header.og { color: #ff4d4f; }
    .event-card-header.yc { color: #fadb14; }
    .event-card-header.rc { color: #ff4d4f; }
    .event-card-header.sub { color: #52c41a; }

    .player-name-text {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      margin-top: 8px;
    }

    .assist-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--arsenal-gold);
      font-weight: 700;
      padding: 2px 8px;
      width: fit-content;
      margin-top: 2px;
    }

    .sub-card-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .sub-card-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding-bottom: 6px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.12);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .sub-card-header .header-out { color: #ff4d4f; text-align: left; }
    .sub-card-header .header-in { color: #52c41a; text-align: left; }

    .sub-card-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .sub-name-out {
      font-size: 15px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.6);
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sub-name-in {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .count-badge {
      display: inline-block;
      background: var(--arsenal-red);
      color: white;
      font-size: 11px;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 10px;
      border: 1px solid var(--arsenal-gold);
      margin-left: 4px;
    }

    .match-info-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--pl-card-bg);
      border: 1px solid var(--pl-card-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      gap: 12px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .info-value {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
    }

    .stats-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 18px;
      margin-bottom: 18px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
    }

    .stats-group:last-child {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 50px 1fr 180px 1fr 50px;
      align-items: center;
      gap: 12px;
    }

    .stat-val.left-side {
      text-align: right;
      font-weight: 900;
      font-size: 15px;
    }

    .stat-val.right-side {
      text-align: left;
      font-weight: 900;
      font-size: 15px;
    }

    .stat-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--pl-sub-text);
      text-align: center;
      white-space: nowrap;
    }

    .stat-bar-wrapper {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      display: flex;
    }

    .stat-bar-wrapper.left-side {
      justify-content: flex-end;
    }

    .stat-bar-wrapper.right-side {
      justify-content: flex-start;
    }

    .bar-fill-home {
      height: 100%;
      background: var(--arsenal-red);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .bar-fill-away {
      height: 100%;
      background: #ffffff;
      border-radius: 3px;
      transition: width 0.3s ease;
    }

.footer-text {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--pl-sub-text);
  
  /* 구분선 설정 */
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  padding-top: 14px; /* 구분선과 글자 사이의 간격 */
  
  /* Red Cards와 구분선 사이의 위쪽 간격을 28px로 확실히 띄움 */
  margin-top: 28px !important;
  margin-bottom: 0;
}

.footer-left b,
.footer-right b {
  color: var(--arsenal-gold);
  font-weight: 700;
}



    .bench-container {
      margin-top: 16px;
      background: var(--pl-card-bg);
      border: 1px solid var(--pl-card-border);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bench-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--arsenal-gold);
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bench-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px 16px;
    }

    .bench-player-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(25, 0, 34, 0.6);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .bench-number {
      font-size: 12px;
      font-weight: 900;
      color: var(--arsenal-gold);
      min-width: 18px;
      text-align: center;
    }

    .bench-name {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <div class="config-panel">
    <input type="text" id="sheet-id-input" placeholder="구글 시트 URL 또는 ID 입력" value="">
    <button class="btn-sync" onclick="syncSheetData(true)">🔄 시트 데이터 동기화</button>
  </div>

  <div class="preview-container">
    <div class="card-wrapper">
      <button class="btn-save-card" onclick="saveCardAsImage('capture-area-stats', 'Arsenal_Stats_Card.png')">📸 카드 저장 (PNG)</button>
      <div id="capture-area-stats" class="capture-card">
        <div class="header-box">
          <div class="match-score-board">
            <span class="team-name" id="home-team-stats">Arsenal</span>
            <span class="score-num" id="score-stats">0 - 0</span>

          </div>
        </div>
        <div id="stats-card-target"></div>
<div class="footer-text">

      <div id="capture-area-pitch" class="capture-card">
        <div class="section-title">Starting XI</div>
        <div class="pitch" id="pitch-target"></div>

        <div class="section-title">TIMELINE</div>

          <div class="v-timeline-line"></div>
        </div>

      </div>
    </div>

  <script>
    const SECRET_PIN = "1886";

    function saveCardAsImage(elementId, fileName) {
      const targetElement = document.getElementById(elementId);
      if (!targetElement) return;

      html2canvas(targetElement, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#190022'
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = fileName;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(err => {
        alert('이미지 저장 중 오류가 발생했습니다.');
        console.error(err);
      });
    }

    async function fetchCSV(spreadsheetId, sheetName) {
      const cacheBuster = new Date().getTime();
      const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/export?format=csv&sheet=${encodeURIComponent(sheetName)}&t=${cacheBuster}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Network error');
      const text = await res.text();
      return parseCSVRows(text);
    }

    function parseCSVRows(text) {
      const lines = text.replace(/\r/g, '').split('\n');
      return lines.map(line => line.split(',').map(cell => cell.replace(/^"(.*)"$/, '$1').trim()));
    }

    async function syncSheetData(isManualClick = false) {
      let rawId = document.getElementById('sheet-id-input').value.trim();

      if (!rawId) {
        rawId = localStorage.getItem('my_arsenal_sheet_id') || '';
      }

      if (!rawId || isManualClick) {
        if (!rawId) {
          const inputPin = prompt("🔑 접근 암호를 입력하세요:");
          if (inputPin !== SECRET_PIN) {
            alert("❌ 암호가 올바르지 않습니다.");
            return;
          }
          const userSheetId = prompt("📊 사용할 구글 시트 ID 또는 URL을 입력하세요:");
          if (!userSheetId) return;
          rawId = userSheetId.trim();
        }
      }

      const match = rawId.match(/\/d\/([a-zA-Z0-9-_]+)/);
      if (match) rawId = match[1];

      try {
        const matchesData = await fetchCSV(rawId, 'matches');
        
        localStorage.setItem('my_arsenal_sheet_id', rawId);
        document.getElementById('sheet-id-input').value = rawId;

        renderHeader(matchesData);
        renderPitch(matchesData);
        renderTimeline(matchesData);
        renderMatchStatsCard(matchesData);
      } catch (err) {
        alert('시트 데이터를 불러오지 못했습니다. 뷰어 권한을 확인해 주세요.');
        console.error(err);
      }
    }

    function renderHeader(data) {
      let awayTeam = 'Chelsea';
      let arsScore = '0';
      let awayScore = '0';

      const haType = (data[6] && data[6][1]) ? data[6][1].trim() : 'Away';
      const isAway = haType.toLowerCase() === 'away';

      if (data[5]) awayTeam = data[5][1] || data[5][2] || 'Chelsea';

      if (data[2] && data[2][4] === 'Score') {
        arsScore = data[2][5] || '0';
        awayScore = data[2][6] || '0';
      }

      const leftTeam = isAway ? awayTeam : "Arsenal";
      const rightTeam = isAway ? "Arsenal" : awayTeam;
      const scoreText = isAway ? `${awayScore} - ${arsScore}` : `${arsScore} - ${awayScore}`;

      document.getElementById('home-team-stats').innerText = leftTeam;
      document.getElementById('away-team-stats').innerText = rightTeam;
      document.getElementById('score-stats').innerText = scoreText;
    }

    function renderPitch(data) {
      const pitchTarget = document.getElementById('pitch-target');
      pitchTarget.innerHTML = `
        <div class="pitch-line-center"></div>
        <div class="pitch-circle"></div>
        <div class="pitch-area-left"></div>
        <div class="pitch-area-right"></div>
      `;

      const haType = (data[6] && data[6][1]) ? data[6][1].trim() : 'Away';
      const isAway = haType.toLowerCase() === 'away';

      const formationName = (data[1] && data[1][9]) ? data[1][9].trim() : '';
      const pitchSectionTitle = document.querySelector('#capture-area-pitch .section-title');
      if (pitchSectionTitle) {
        const fmtText = formationName ? ` (${formationName})` : '';
        pitchSectionTitle.innerText = `Starting XI & Formation${fmtText}`;
      }

      for (let r = 3; r <= 13; r++) {
        if (!data[r]) continue;

        const num = data[r][9] || '';
        const name = data[r][10] || '';
        let xVal = parseFloat(data[r][12]);
        let yVal = parseFloat(data[r][13]);

        if (!isNaN(xVal) && !isNaN(yVal)) {
          const finalX = isAway ? (100 - xVal) : xVal;

          const badge = document.createElement('div');
          badge.className = 'player-badge';
          badge.style.left = `${finalX}%`;
          badge.style.top = `${yVal}%`;
          badge.innerHTML = `
            <div class="jersey">${num}</div>
            <div class="player-name">${name}</div>
          `;
          pitchTarget.appendChild(badge);
        }
      }

      const subPlayers = [];
      for (let r = 15; r < data.length; r++) {
        const row = data[r];
        if (!row || !row[8]) continue;

        const num = row[9] || '';
        const name = row[10] || '';

        if (name && name !== '-') {
          subPlayers.push({ num, name });
        }
      }

      const pitchCardContainer = document.getElementById('capture-area-pitch');
      const oldBench = pitchCardContainer.querySelector('.bench-container');
      if (oldBench) oldBench.remove();

      if (subPlayers.length > 0) {
        let benchItemsHtml = '';
        subPlayers.forEach(p => {
          benchItemsHtml += `
            <div class="bench-player-item">
              <span class="bench-number">${p.num}</span>
              <span class="bench-name">${p.name}</span>
            </div>
          `;
        });

        const benchDiv = document.createElement('div');
        benchDiv.className = 'bench-container';
        benchDiv.innerHTML = `
          <div class="bench-title">🪑 SUBSTITUTES</div>
          <div class="bench-grid">${benchItemsHtml}</div>
        `;

        const footer = pitchCardContainer.querySelector('.footer-text');
        pitchCardContainer.insertBefore(benchDiv, footer);
      }
    }

    // ★ 옵션 A(교체 간소화) 및 미입력 점선 제거 로직 반영 ★
    function renderTimeline(data) {
      const tlContainer = document.getElementById('timeline-target');
      tlContainer.innerHTML = '<div class="v-timeline-line"></div>';

      const haType = (data[6] && data[6][1]) ? data[6][1].trim() : 'Away';
      const isAway = haType.toLowerCase() === 'away';

      const rawEvents = [];
      const goalCounts = {};

      function parseTimeCell(rawStr) {
        if (!rawStr) return null;
        const clean = rawStr.toString().trim();
        const parts = clean.split(/\s+/);
        if (parts.length === 1 && !isNaN(parts[0]) && parts[0] !== '') {
          return { base: parseInt(parts[0], 10), extra: 0, display: `${parts[0]}'` };
        } else if (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
          return { base: parseInt(parts[0], 10), extra: parseInt(parts[1], 10), display: `${parts[0]}+${parts[1]}'` };
        }
        return null;
      }

      for (let r = 29; r < data.length; r++) {
        const row = data[r];
        if (!row || !row[0] || !row[1]) continue;

        const parsedTime = parseTimeCell(row[0]);
        const type = row[1].trim();
        const team = row[2] ? row[2].trim() : 'ARS';
        const p1 = row[4] || '';
        const p2 = row[6] || '';

        if (parsedTime && ['GOAL', 'OG', 'YC', 'RC', 'SUB'].includes(type)) {
          if (type === 'GOAL' && p1) {
            goalCounts[p1] = (goalCounts[p1] || 0) + 1;
          }
          rawEvents.push({
            rowIndex: r,
            base: parsedTime.base,
            extra: parsedTime.extra,
            display: parsedTime.display,
            type,
            team,
            p1,
            p2
          });
        }
      }

      rawEvents.sort((a, b) => {
        if (a.base !== b.base) return a.base - b.base;
        if (a.extra !== b.extra) return a.extra - b.extra;
        return a.rowIndex - b.rowIndex;
      });

      const subMergedEvents = [];
      rawEvents.forEach(evt => {
        if (evt.type === 'SUB') {
          const existing = subMergedEvents.find(g => g.type === 'SUB' && g.display === evt.display && g.team === evt.team);
          if (existing) {
            existing.subs.push({ out: evt.p1, in: evt.p2 });
          } else {
            subMergedEvents.push({
              rowIndex: evt.rowIndex,
              base: evt.base,
              extra: evt.extra,
              display: evt.display,
              type: 'SUB',
              team: evt.team,
              subs: [{ out: evt.p1, in: evt.p2 }]
            });
          }
        } else {
          subMergedEvents.push(evt);
        }
      });

      const timeGroupedEvents = [];
      subMergedEvents.forEach(evt => {
        const lastGroup = timeGroupedEvents[timeGroupedEvents.length - 1];
        if (lastGroup && lastGroup.display === evt.display) {
          lastGroup.events.push(evt);
        } else {
          timeGroupedEvents.push({
            base: evt.base,
            extra: evt.extra,
            display: evt.display,
            events: [evt]
          });
        }
      });

      const finalStream = [];
      finalStream.push({ isBoundary: true, text: 'KICK OFF' });

      let halfTimeAdded = false;
      timeGroupedEvents.forEach(group => {
        if (!halfTimeAdded && group.base > 45) {
          finalStream.push({ isBoundary: true, text: 'HALF TIME' });
          halfTimeAdded = true;
        }
        finalStream.push(group);
      });

      if (!halfTimeAdded) {
        finalStream.push({ isBoundary: true, text: 'HALF TIME' });
      }
      finalStream.push({ isBoundary: true, text: 'FULL TIME' });

      finalStream.forEach(item => {
        const div = document.createElement('div');
        div.className = 'v-timeline-item';

        if (item.isBoundary) {
          div.innerHTML = `<div class="v-timeline-node boundary">${item.text}</div>`;
        } else {
          let leftCardsHtml = '';
          let rightCardsHtml = '';

          item.events.forEach(evt => {
            const isArsenalEvent = (evt.team === 'ARS');
            let side = isAway ? (isArsenalEvent ? 'right' : 'left') : (isArsenalEvent ? 'left' : 'right');

            let cardContent = '';
            if (evt.type === 'SUB') {
              // 교체 선수 존재 여부 확인
              const hasValidPlayers = evt.subs.some(s => (s.out && s.out.trim() !== '' && s.out.trim() !== '-') || (s.in && s.in.trim() !== '' && s.in.trim() !== '-'));

              if (hasValidPlayers) {
                // 아스널 등 선수명이 제대로 입력되어 있는 경
                let subRowsHtml = '';
                evt.subs.forEach(s => {
                  subRowsHtml += `
                    <div class="sub-card-row">
                      <span class="sub-name-out">${s.out || '-'}</span>
                      <span class="sub-name-in">${s.in || '-'}</span>
                    </div>
                  `;
                });
                cardContent = `
                  <div class="event-card">
                    <div class="sub-card-container">
                      <div class="sub-card-header">
                        <span class="header-out">🔻 OUT</span>
                        <span class="header-in">🟢 IN</span>
                      </div>
                      ${subRowsHtml}
                    </div>
                  </div>
                `;
              } else {
                cardContent = `
                  <div class="event-card">
                    <div class="event-card-header sub no-border">
                      🔄 SUBSTITUTION
                    </div>
                  </div>
                `;
              }
            } else {
              let headerText = '⚽ GOAL';
              let headerClass = 'goal';
              let cardHighlightClass = '';

              if (evt.type === 'GOAL') {
                cardHighlightClass = 'goal-card';
              } else if (evt.type === 'OG') {
                headerText = '⚽ OWN GOAL';
                headerClass = 'og';
                cardHighlightClass = 'og-card';
              } else if (evt.type === 'YC') {
                headerText = '🟨 YELLOW CARD';
                headerClass = 'yc';
              } else if (evt.type === 'RC') {
                headerText = '🟥 RED CARD';
                headerClass = 'rc';
              }

              let countBadgeHtml = '';
              if (evt.type === 'GOAL' && goalCounts[evt.p1] > 1) {
                countBadgeHtml = `<span class="count-badge">${goalCounts[evt.p1]}G</span>`;
              }

              let assistHtml = '';
              if (evt.type === 'GOAL' && evt.p2) {
                assistHtml = `<span class="assist-tag">👟 Ast: ${evt.p2}</span>`;
              }

              // ★ 선수 이름 존재 여부에 따른 점선 유무(no-border 클래스) 제어 ★
              const hasPlayer = (evt.p1 && evt.p1.trim() !== '' && evt.p1.trim() !== '-');
              const borderClass = hasPlayer ? '' : 'no-border';

              let playerNameHtml = '';
              if (hasPlayer) {
                playerNameHtml = `
                  <div class="player-name-text">
                    ${evt.p1}
                    ${countBadgeHtml}
                  </div>
                `;
              }

              cardContent = `
                <div class="event-card ${cardHighlightClass}">
                  <div class="event-card-header ${headerClass} ${borderClass}">
                    ${headerText}
                  </div>
                  ${playerNameHtml}
                  ${assistHtml}
                </div>
              `;
            }

            if (side === 'left') {
              leftCardsHtml += cardContent;
            } else {
              rightCardsHtml += cardContent;
            }
          });

          div.innerHTML = `
            <div class="v-timeline-node">${item.display}</div>
            <div class="v-timeline-side left">
              ${leftCardsHtml}
            </div>
            <div class="v-timeline-side right">
              ${rightCardsHtml}
            </div>
          `;
        }
        tlContainer.appendChild(div);
      });
    }

    function renderMatchStatsCard(data) {
      const matchDate = data[1] ? data[1][1] : '2026-10-31';
      const matchTime = data[2] ? data[2][1] : '23:00';
      const awayTeamName = data[5] ? data[5][1] : 'Chelsea';
      const stadium = data[6] ? data[6][2] : 'Stamford Bridge';
      const haType = data[6] ? data[6][1] : 'Away';

      const isAway = haType.trim().toLowerCase() === 'away';

      const compType = (data[7] && data[7][1]) ? data[7][1] : 'PL';
      const compRound = (data[7] && data[7][2]) ? data[7][2] : 'Round 10';

      const group2Start = 'Total Shot';
      const group3Start = 'Touches';
      const group4Start = 'Duels Won';

      const groups = [[], [], [], []];
      let currentGroupIndex = 0;

      for (let r = 3; r <= 21; r++) {
        const row = data[r];
        if (!row || !row[4]) continue;

        const name = row[4].trim();
        if (name === 'Score') continue;

        if (name === group2Start) currentGroupIndex = 1;
        else if (name === group3Start) currentGroupIndex = 2;
        else if (name === group4Start) currentGroupIndex = 3;

        let homeRaw = row[5] !== undefined ? row[5].toString().replace('%', '') : '0';
        let awayRaw = row[6] !== undefined ? row[6].toString().replace('%', '') : '0';

        groups[currentGroupIndex].push({
          name,
          homeDisplay: row[5],
          awayDisplay: row[6],
          homeVal: parseFloat(homeRaw) || 0,
          awayVal: parseFloat(awayRaw) || 0
        });
      }

      const statsCard = document.getElementById('stats-card-target');
      if (!statsCard) return;

      const infoBarHtml = `
        <div class="match-info-bar">
          <div class="info-item"><span class="info-value">${matchDate}</span></div>
          <div class="info-item"><span class="info-value">${matchTime}</span></div>
          <div class="info-item"><span class="info-value">${compType} (${compRound})</span></div>
          <div class="info-item"><span class="info-value">${stadium}</span></div>
        </div>
      `;

      function renderGroupHtml(statList) {
        if (!statList || statList.length === 0) return '';
        let html = '<div class="stats-group">';
        statList.forEach(s => {
          const total = s.homeVal + s.awayVal;
          const homeWidth = total > 0 ? (s.homeVal / total) * 100 : 0;
          const awayWidth = total > 0 ? (s.awayVal / total) * 100 : 0;

          const leftVal = isAway ? s.awayDisplay : s.homeDisplay;
          const rightVal = isAway ? s.homeDisplay : s.awayDisplay;
          const leftWidth = isAway ? awayWidth : homeWidth;
          const rightWidth = isAway ? homeWidth : awayWidth;
          
          const leftBarClass = isAway ? 'bar-fill-away' : 'bar-fill-home';
          const rightBarClass = isAway ? 'bar-fill-home' : 'bar-fill-away';

          const leftTextColor = isAway ? '#ffffff' : 'var(--arsenal-red)';
          const rightTextColor = isAway ? 'var(--arsenal-red)' : '#ffffff';

          html += `
            <div class="stat-row">
              <div class="stat-val left-side" style="color: ${leftTextColor};">${leftVal}</div>
              <div class="stat-bar-wrapper left-side">
                <div class="${leftBarClass}" style="width: ${leftWidth}%;"></div>
              </div>
              <div class="stat-name">${s.name}</div>
              <div class="stat-bar-wrapper right-side">
                <div class="${rightBarClass}" style="width: ${rightWidth}%;"></div>
              </div>
              <div class="stat-val right-side" style="color: ${rightTextColor};">${rightVal}</div>
            </div>
          `;
        });
        html += '</div>';
        return html;
      }

      statsCard.innerHTML = `
        ${infoBarHtml}
        <div class="section-title">PERFORMANCE STATUS</div>
        ${renderGroupHtml(groups[0])}
        ${renderGroupHtml(groups[1])}
        ${renderGroupHtml(groups[2])}
        ${renderGroupHtml(groups[3])}
      `;
    }

    window.onload = () => {
      syncSheetData(false);
    };
  </script>
</body>
